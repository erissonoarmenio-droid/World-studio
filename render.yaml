# Blueprint do Render: cria o servidor e o banco de uma vez.
# Região Virgínia (Leste dos EUA), a mais perto do Brasil entre as opções.
services:
  - type: web
    name: world-studio-web
    runtime: docker
    region: virginia
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /saude
    preDeployCommand: alembic upgrade head
    autoDeploy: true
    envVars:
      - key: AMBIENTE
        value: producao
      - key: DATABASE_URL
        fromDatabase:
          name: world-studio-db
          property: connectionString
      # Cloudflare R2: o Eri preenche no painel do Render (nunca no repositório).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_MIDIAS
        value: world-studio-midias
      - key: R2_BUCKET_BACKUP
        value: world-studio-backup

databases:
  - name: world-studio-db
    region: virginia
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: world_studio
    ipAllowList: []   # sem acesso de fora: só os serviços do Render falam com o banco
