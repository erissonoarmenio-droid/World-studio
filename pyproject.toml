[project]
name = "world-estudio"
version = "0.1.0"
description = "Estúdio W-orld: influencer de IA para lojas (servidor, bot, geração e central)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
    "opencv-python-headless>=4.10,<6",  # medidor de rosto (07/11)
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "moto[s3]>=5,<6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ferramentas/testes"]  # scripts históricos de teste (31/10), fora do padrão

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert é permitido nos testes

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # gerado pelo Alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
